name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_VERSION: 1.14.8
  AWS_REGION: us-east-1

jobs:
  validate:
    name: Validate Terraform and Ansible
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Install Ansible tooling
        run: |
          python3 -m pip install --user ansible-core ansible-lint yamllint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Ansible syntax check
        working-directory: ansible
        run: ansible-playbook --syntax-check playbooks/nginx.yml

      - name: Ansible lint
        run: ansible-lint ansible/playbooks/nginx.yml

      - name: YAML lint
        run: yamllint -d relaxed .github ansible

  deploy:
    name: Provision and deploy
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_key_name: ${{ vars.TF_KEY_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Verify AWS role configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "AWS_ROLE_ARN is missing. Add it as a repository or production environment secret."
            exit 1
          fi

      - name: Verify Terraform variables
        run: |
          if [ -z "$TF_VAR_key_name" ]; then
            echo "TF_KEY_NAME must be configured as a production environment variable."
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: github-actions-${{ github.run_id }}

      - name: Prepare and validate SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "ANSIBLE_SSH_PRIVATE_KEY is missing from the production environment secrets."
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/deployment_key"
          chmod 600 "$HOME/.ssh/deployment_key"
          if ! ssh-keygen -y -f "$HOME/.ssh/deployment_key" > /dev/null 2>&1; then
            echo "ANSIBLE_SSH_PRIVATE_KEY is not a valid, unencrypted private SSH key."
            exit 1
          fi

      - name: Allow SSH from this runner
        run: |
          runner_ip="$(curl --fail --silent --show-error https://api.ipify.org)"
          if ! [[ "$runner_ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not determine a valid public IPv4 address for the runner."
            exit 1
          fi
          echo "TF_VAR_allowed_ssh_cidr=${runner_ip}/32" >> "$GITHUB_ENV"
          echo "Configured SSH access for the current runner IP."

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Install Ansible
        run: python3 -m pip install --user ansible-core

      - name: Generate Ansible inventory from Terraform
        working-directory: terraform
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          servers = json.loads(subprocess.check_output([
              "terraform", "output", "-json", "web_servers"
          ]))
          inventory = {
              "all": {
                  "children": {
                      "webservers": {
                          "hosts": {
                              name: {"ansible_host": data["public_ip"]}
                              for name, data in servers.items()
                          },
                          "vars": {
                              "ansible_user": "ubuntu",
                              "ansible_ssh_private_key_file": str(
                                  Path.home() / ".ssh" / "deployment_key"
                              ),
                          },
                      }
                  }
              }
          }
          Path("../ansible/inventory/generated.yml").write_text(
              json.dumps(inventory, indent=2) + "\n"
          )
          PY

      - name: Deploy Nginx with Ansible
        working-directory: ansible
        run: ansible-playbook -i inventory/generated.yml playbooks/nginx.yml
